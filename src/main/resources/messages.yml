tokens:
  prefix: "#03fc88FoDropBooster &8» #a7b8b0"
  theme: "#03fc88"
  muted: "#a7b8b0"
  white: "#ffffff"
  good: "#3ecf8e"
  bad: "#ff5d73"

messages:
  no-permission: "{prefix}{bad}You cannot do that."
  player-only: "{prefix}{bad}Only players can use that."
  usage: "{prefix}{muted}Use {theme}/fodropboosteradmin <version|reload|editor|give|removeactive>{muted}."
  help:
    - "{prefix}{theme}/dbadmin editor {muted}- Open the editor."
    - "{prefix}{theme}/dbadmin reload {muted}- Reload files."
    - "{prefix}{theme}/dbadmin version {muted}- Check version."
    - "{prefix}{theme}/dbadmin give <player> preset <id> [amount] {muted}- Give a preset booster."
    - "{prefix}{theme}/dbadmin give <player> custom [drop|xp] <personal|team|global|world> <multiplier> <duration> [world|current] [amount] {muted}- Give a custom booster."
    - "{prefix}{theme}/dbadmin removeactive <personal|team|world|global|id> <target> {muted}- Remove active boosters."
  invalid-player: "{prefix}{bad}That player is not online."
  invalid-world: "{prefix}{bad}That world does not exist."
  invalid-number: "{prefix}{bad}That number is invalid."
  invalid-material: "{prefix}{bad}That material is invalid."
  invalid-duration: "{prefix}{bad}Use a duration like {theme}900{bad}, {theme}15m{bad}, or {theme}1h{bad}."
  invalid-type: "{prefix}{bad}Use booster type personal, team, global, or world."
  teams-unavailable: "{prefix}{bad}Team boosters require FoTeams."
  no-team: "{prefix}{bad}You must be in a team to activate this booster."
  folevels-required: "{prefix}{bad}FoLevels is required for the leveling booster system."
  invalid-id: "{prefix}{bad}Use an ID with 2-32 letters, numbers, dashes, or underscores."
  booster-exists: "{prefix}{bad}That booster already exists."
  booster-missing: "{prefix}{bad}That booster does not exist."
  cannot-delete-last-booster: "{prefix}{bad}You must keep at least one booster preset."
  reload: "{prefix}{good}Reloaded files."
  reload-failed: "{prefix}{bad}Reload failed: {error}"
  give: "{prefix}{good}Gave {theme}{amount}x {muted}booster to {theme}{player}{muted}."
  received: "{prefix}{good}You received {theme}{amount}x {muted}booster."
  stacked-item: "{prefix}{bad}Unstack this booster before using it."
  active-exists: "{prefix}{bad}A conflicting booster is already active."
  disabled-world: "{prefix}{bad}Boosters are disabled in this world."
  activated: "{prefix}{good}Activated {theme}{multiplier}x {muted}{target} {type} booster for {theme}{duration}{muted}."
  activated-global: "{prefix}{theme}{player} {muted}activated a {theme}{multiplier}x {muted}global {target} booster for {theme}{duration}{muted}."
  activated-world: "{prefix}{theme}{player} {muted}activated a {theme}{multiplier}x {muted}{target} booster in {theme}{world} {muted}for {theme}{duration}{muted}."
  expired: "{prefix}{muted}Your booster expired."
  removed-active: "{prefix}{good}Removed {theme}{amount} {muted}active booster(s)."
  no-active: "{prefix}{bad}No matching active boosters were found."
  bossbar-usage: "{prefix}{muted}Use {theme}/dropboosterbossbar [on|off]{muted}."
  bossbar-enabled: "{prefix}{good}Drop booster bossbar enabled."
  bossbar-disabled: "{prefix}{muted}Drop booster bossbar disabled."
  editor-saved: "{prefix}{good}Saved {theme}{setting}{muted}."
  editor-created: "{prefix}{good}Created booster {theme}{booster}{muted}."
  editor-deleted: "{prefix}{good}Deleted booster {theme}{booster}{muted}."
  editor-cancelled: "{prefix}{muted}Cancelled."
  prompt: "{prefix}{muted}Type {theme}{format} {muted}in chat, or {bad}cancel{muted}."
  native-dialogs-fallback: "{prefix}{bad}Native dialogs are not supported on this server. Using chat input."
